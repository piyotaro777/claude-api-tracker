<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐺 API Tracker 🩵</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(160deg, #F0F4FF 0%, #FFF5F9 40%, #F0FAFF 100%); min-height: 100vh; }
    input[type="number"]::-webkit-inner-spin-button { opacity: 0.3; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const USAGE_PROFILES = [
      { id: "haiku-reply", label: "Haiku会話", emoji: "🐣", costPer: 0.0027, tokPer: "~900", desc: "Reply 1往復" },
      { id: "sonnet-push", label: "Sonnet配信", emoji: "🎵", costPer: 0.0099, tokPer: "~1,800", desc: "Push 1通" },
    ];

    const STORAGE_KEY = "chappiyo-api-tracker";

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

    function saveData(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    function daysBetween(a, b) {
      return Math.max(1, Math.round(Math.abs(new Date(b) - new Date(a)) / 86400000));
    }

    function fmtDT(iso) {
      return new Date(iso).toLocaleDateString("ja-JP", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function StatBox({ label, value, sub, color }) {
      return (
        <div style={{ flex: 1, background: color + "12", borderRadius: 12, padding: "10px 8px", textAlign: "center" }}>
          <div style={{ fontSize: 10, color: "#8A9BBF", fontWeight: 500, marginBottom: 4 }}>{label}</div>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#5B6B8A" }}>{value}</div>
          {sub && <div style={{ fontSize: 10, color: "#AABBD4", marginTop: 2 }}>{sub}</div>}
        </div>
      );
    }

    function App() {
      const [chargeTotal, setChargeTotal] = useState(5);
      const [snaps, setSnaps] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [newBal, setNewBal] = useState("");
      const [newMemo, setNewMemo] = useState("");
      const [rate, setRate] = useState(150);
      const [editCharge, setEditCharge] = useState(false);
      const [confirmClear, setConfirmClear] = useState(false);
      const [showData, setShowData] = useState(false);
      const [importMsg, setImportMsg] = useState("");
      const fileRef = useRef(null);

      useEffect(() => {
        const s = loadData();
        if (s) {
          if (s.chargeTotal !== undefined) setChargeTotal(s.chargeTotal);
          if (s.snapshots) setSnaps(s.snapshots);
          if (s.exchangeRate) setRate(s.exchangeRate);
        }
      }, []);

      useEffect(() => {
        saveData({ chargeTotal, snapshots: snaps, exchangeRate: rate });
      }, [chargeTotal, snaps, rate]);

      const curBal = snaps.length > 0 ? snaps[snaps.length - 1].balance : chargeTotal;
      const used = chargeTotal - curBal;
      const pct = chargeTotal > 0 ? Math.max(0, (curBal / chargeTotal) * 100) : 100;

      let dailySpend = null;
      if (snaps.length >= 2) {
        const l = snaps[snaps.length - 1], p = snaps[snaps.length - 2];
        const sp = p.balance - l.balance;
        if (sp > 0) dailySpend = sp / daysBetween(p.date, l.date);
      }

      let overallSpend = null;
      if (snaps.length >= 2) {
        const f = snaps[0], l = snaps[snaps.length - 1];
        const sp = f.balance - l.balance;
        if (sp > 0) overallSpend = sp / daysBetween(f.date, l.date);
      }

      const estDays = dailySpend ? Math.floor(curBal / dailySpend) : null;
      const estDaysAll = overallSpend ? Math.floor(curBal / overallSpend) : null;

      function addSnap() {
        const b = parseFloat(newBal);
        if (isNaN(b) || b < 0) return;
        setSnaps(prev => [...prev, { id: Date.now(), date: new Date().toISOString(), balance: b, memo: newMemo.trim() }]);
        setNewBal(""); setNewMemo(""); setShowForm(false);
      }

      function rmSnap(id) { setSnaps(prev => prev.filter(s => s.id !== id)); }
      function clearAll() { setSnaps([]); setConfirmClear(false); }

      function getDiff(i) {
        if (i === 0) return null;
        const c = snaps[i], p = snaps[i - 1], sp = p.balance - c.balance, dy = daysBetween(p.date, c.date);
        return { spent: sp, days: dy, perDay: sp / dy };
      }

      function d2c(dollars, pid) {
        const pr = USAGE_PROFILES.find(p => p.id === pid);
        return (!pr || dollars <= 0) ? 0 : Math.floor(dollars / pr.costPer);
      }

      function doExport() {
        const d = { chargeTotal, snapshots: snaps, exchangeRate: rate, exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
        const u = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = u;
        a.download = "chappiyo-tracker-" + new Date().toISOString().slice(0, 10) + ".json";
        a.click(); URL.revokeObjectURL(u); setShowData(false);
      }

      function doImport(e) {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = function(ev) {
          try {
            const d = JSON.parse(ev.target.result);
            if (d.chargeTotal !== undefined) setChargeTotal(d.chargeTotal);
            if (d.snapshots) setSnaps(d.snapshots);
            if (d.exchangeRate) setRate(d.exchangeRate);
            setImportMsg("✅ インポート完了！");
          } catch { setImportMsg("❌ 読み込み失敗"); }
          setTimeout(() => setImportMsg(""), 3000);
          setShowData(false);
        };
        r.readAsText(f); e.target.value = "";
      }

      const nb = parseFloat(newBal);
      const hasDiff = snaps.length > 0 && !isNaN(nb) && nb < snaps[snaps.length - 1].balance;
      const diffAmt = hasDiff ? snaps[snaps.length - 1].balance - nb : 0;
      const gc = pct > 50 ? "#7EC8C8" : pct > 20 ? "#E8C170" : "#E88B8B";

      return (
        <div style={{ minHeight: "100vh", fontFamily: "'M PLUS Rounded 1c', sans-serif", padding: 16, maxWidth: 480, margin: "0 auto" }}>

          <div style={{ textAlign: "center", marginBottom: 20, padding: "16px 0 8px" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: "#5B6B8A" }}>🐺 API Tracker 🩵</div>
            <div style={{ fontSize: 11, color: "#9AADCF", marginTop: 4 }}>ちゃっぴよ コスト管理</div>
          </div>

          {importMsg && <div style={{ textAlign: "center", padding: 8, marginBottom: 10, fontSize: 13, color: "#5B6B8A", background: "#E8F4FD", borderRadius: 10 }}>{importMsg}</div>}

          {/* Balance Card */}
          <div style={{ background: "white", borderRadius: 20, padding: 20, marginBottom: 14, boxShadow: "0 2px 12px rgba(155,181,224,0.12)" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 12, color: "#8A9BBF", fontWeight: 500 }}>チャージ総額</span>
                {editCharge ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <span style={{ fontSize: 16, color: "#5B6B8A", fontWeight: 700 }}>$</span>
                    <input type="number" value={chargeTotal} onChange={e => setChargeTotal(Number(e.target.value) || 0)} onBlur={() => setEditCharge(false)} autoFocus
                      style={{ width: 60, fontSize: 20, fontWeight: 700, color: "#5B6B8A", border: "none", borderBottom: "2px solid #9BB5E0", background: "transparent", textAlign: "center", outline: "none", fontFamily: "inherit" }} />
                  </div>
                ) : (
                  <div onClick={() => setEditCharge(true)} style={{ fontSize: 20, fontWeight: 700, color: "#5B6B8A", cursor: "pointer" }}>${chargeTotal.toFixed(2)}</div>
                )}
              </div>
              <button onClick={() => setChargeTotal(p => p + 5)}
                style={{ padding: "5px 12px", borderRadius: 8, border: "1.5px solid #D6E4F7", background: "#F8FAFF", color: "#8A9BBF", fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>+$5</button>
            </div>

            <div style={{ background: "#F0F4FA", borderRadius: 12, height: 32, overflow: "hidden", position: "relative", marginBottom: 14 }}>
              <div style={{ background: `linear-gradient(90deg, ${gc}, ${gc}BB)`, height: "100%", width: `${pct}%`, borderRadius: 12, transition: "width 0.5s", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {pct > 20 && <span style={{ fontSize: 12, color: "white", fontWeight: 700 }}>${curBal.toFixed(2)} 残り</span>}
              </div>
              {pct <= 20 && <span style={{ position: "absolute", left: "50%", top: "50%", transform: "translate(-50%,-50%)", fontSize: 12, color: "#C4A4A4", fontWeight: 700 }}>${curBal.toFixed(2)} 残り</span>}
            </div>

            <div style={{ display: "flex", gap: 8 }}>
              <StatBox label="残高" value={`$${curBal.toFixed(2)}`} sub={`¥${Math.round(curBal * rate)}`} color="#7EC8C8" />
              <StatBox label="使用済み" value={`$${Math.max(0, used).toFixed(2)}`} sub={`¥${Math.round(Math.max(0, used) * rate)}`} color="#E88B8B" />
              <StatBox label="消費率" value={`${Math.min(100, 100 - pct).toFixed(1)}%`} sub={snaps.length > 0 ? `${snaps.length}回記録` : "—"} color="#9BB5E0" />
            </div>
          </div>

          {/* Remaining Conversations */}
          {curBal > 0 && (
            <div style={{ background: "white", borderRadius: 20, padding: "16px 18px", marginBottom: 14, boxShadow: "0 2px 12px rgba(155,181,224,0.12)" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#8A9BBF", marginBottom: 12 }}>🐺 残高であと何回？</div>
              <div style={{ display: "flex", gap: 6 }}>
                {USAGE_PROFILES.map(p => (
                  <div key={p.id} style={{ flex: 1, background: "#F8FAFF", borderRadius: 12, padding: "10px 6px", textAlign: "center" }}>
                    <div style={{ fontSize: 18, marginBottom: 4 }}>{p.emoji}</div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: "#5B6B8A" }}>{d2c(curBal, p.id).toLocaleString()}</div>
                    <div style={{ fontSize: 9, color: "#9AADCF", marginTop: 2 }}>{p.label}</div>
                    <div style={{ fontSize: 8, color: "#C8D8EF", marginTop: 1 }}>{p.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Prediction */}
          {estDays !== null && (
            <div style={{ background: "white", borderRadius: 20, padding: "16px 18px", marginBottom: 14, boxShadow: "0 2px 12px rgba(155,181,224,0.12)" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#8A9BBF", marginBottom: 12 }}>📅 残高予測</div>
              <div style={{ background: "linear-gradient(135deg, #E8F4FD, #F0F0FA)", borderRadius: 14, padding: "12px 16px", marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: 11, color: "#9AADCF", marginBottom: 2 }}>直近ペースだと</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: "#5B6B8A" }}>あと約 {estDays} 日</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 11, color: "#9AADCF" }}>日割り消費</div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#5B6B8A" }}>${dailySpend.toFixed(4)}/日</div>
                    <div style={{ fontSize: 10, color: "#AABBD4" }}>≈ 🐣{Math.round(dailySpend / 0.0027)}回/日</div>
                  </div>
                </div>
              </div>
              {estDaysAll !== null && snaps.length > 2 && (
                <div style={{ background: "#F8FAFF", borderRadius: 12, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: 11, color: "#AABBD4" }}>全期間ペースだと</div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: "#7A8BA8" }}>あと約 {estDaysAll} 日</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 12, color: "#AABBD4" }}>${overallSpend.toFixed(4)}/日</div>
                    <div style={{ fontSize: 10, color: "#C8D8EF" }}>≈ 🐣{Math.round(overallSpend / 0.0027)}回/日</div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Add Snapshot */}
          {!showForm ? (
            <button onClick={() => setShowForm(true)}
              style={{ width: "100%", padding: 14, borderRadius: 16, border: "2px dashed #C8D8EF", background: "transparent", color: "#8A9BBF", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", marginBottom: 14 }}>
              ＋ 残高を記録する
            </button>
          ) : (
            <div style={{ background: "white", borderRadius: 20, padding: 18, marginBottom: 14, boxShadow: "0 2px 16px rgba(155,181,224,0.18)" }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#5B6B8A", marginBottom: 4 }}>残高を記録 📝</div>
              <div style={{ fontSize: 11, color: "#AABBD4", marginBottom: 14 }}>
                <a href="https://console.anthropic.com/settings/billing" target="_blank" rel="noopener noreferrer" style={{ color: "#9BB5E0", textDecoration: "none", fontWeight: 600 }}>Billing ↗</a> の残高（Credit balance）を入力
              </div>

              <div style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 11, color: "#8A9BBF", marginBottom: 4, fontWeight: 500 }}>現在の残高（$）</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 18, fontWeight: 700, color: "#5B6B8A" }}>$</span>
                  <input type="number" step="0.01" placeholder="4.85" value={newBal} onChange={e => setNewBal(e.target.value)}
                    style={{ flex: 1, padding: "10px 12px", borderRadius: 12, border: "1.5px solid #D6E4F7", fontSize: 18, fontWeight: 700, color: "#5B6B8A", fontFamily: "inherit", outline: "none", background: "#FAFCFF" }} />
                </div>
                {hasDiff && (
                  <div style={{ fontSize: 11, color: "#E88B8B", marginTop: 6 }}>
                    前回から ${diffAmt.toFixed(4)} 使ったね <span style={{ color: "#AABBD4" }}>(≈ 🐣{Math.round(diffAmt / 0.0027)}回 / 🎵{Math.round(diffAmt / 0.0099)}回)</span>
                  </div>
                )}
              </div>

              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "#8A9BBF", marginBottom: 4, fontWeight: 500 }}>メモ（任意）</div>
                <input type="text" placeholder="例：1週間運用後..." value={newMemo} onChange={e => setNewMemo(e.target.value)}
                  style={{ width: "100%", padding: "8px 12px", borderRadius: 10, border: "1.5px solid #E2EAF5", fontSize: 13, color: "#5B6B8A", fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
              </div>

              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => { setShowForm(false); setNewBal(""); setNewMemo(""); }}
                  style={{ flex: 1, padding: 10, borderRadius: 12, border: "1.5px solid #D6E4F7", background: "white", color: "#8A9BBF", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>キャンセル</button>
                <button onClick={addSnap}
                  style={{ flex: 1, padding: 10, borderRadius: 12, border: "none", background: "linear-gradient(135deg, #9BB5E0, #7EC8C8)", color: "white", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>記録する 🖤</button>
              </div>
            </div>
          )}

          {/* History */}
          {snaps.length > 0 && (
            <div style={{ background: "white", borderRadius: 20, padding: "16px 18px", marginBottom: 14, boxShadow: "0 2px 12px rgba(155,181,224,0.12)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: "#8A9BBF" }}>記録履歴</span>
                {!confirmClear ? (
                  <button onClick={() => setConfirmClear(true)} style={{ fontSize: 11, color: "#D4A0A0", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit" }}>全削除</button>
                ) : (
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={clearAll} style={{ fontSize: 11, color: "white", background: "#E88B8B", border: "none", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontFamily: "inherit" }}>削除する</button>
                    <button onClick={() => setConfirmClear(false)} style={{ fontSize: 11, color: "#8A9BBF", background: "none", border: "1px solid #D6E4F7", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontFamily: "inherit" }}>やめる</button>
                  </div>
                )}
              </div>
              {[...snaps].reverse().map((s, ri) => {
                const idx = snaps.length - 1 - ri, d = getDiff(idx);
                return (
                  <div key={s.id} style={{ padding: "10px 0", borderBottom: ri < snaps.length - 1 ? "1px solid #F0F4FA" : "none" }}>
                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 700, color: "#5B6B8A" }}>
                          残高 ${s.balance.toFixed(2)}
                          {d && d.spent > 0 && <span style={{ fontSize: 11, color: "#E88B8B", fontWeight: 500, marginLeft: 6 }}>-${d.spent.toFixed(4)}</span>}
                        </div>
                        <div style={{ fontSize: 10, color: "#AABBD4", marginTop: 2 }}>
                          {fmtDT(s.date)}{d && d.spent > 0 && ` (${d.days}日間 · $${d.perDay.toFixed(4)}/日)`}
                        </div>
                        {d && d.spent > 0 && <div style={{ fontSize: 9, color: "#B8CAE4", marginTop: 2 }}>≈ 🐣{Math.round(d.spent / 0.0027)}回 / 🎵{Math.round(d.spent / 0.0099)}回</div>}
                        {s.memo && <div style={{ fontSize: 10, color: "#9BB5E0", marginTop: 2 }}>📝 {s.memo}</div>}
                      </div>
                      <button onClick={() => rmSnap(s.id)} style={{ background: "none", border: "none", color: "#D4BEBE", fontSize: 14, cursor: "pointer", padding: "2px 6px", marginTop: 2 }}>×</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Guide */}
          {snaps.length === 0 && (
            <div style={{ background: "#F8FAFF", borderRadius: 16, padding: "16px 18px", marginBottom: 14, fontSize: 12, color: "#8A9BBF", lineHeight: 1.8 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, fontSize: 13 }}>💡 使い方</div>
              <div>① <a href="https://console.anthropic.com/settings/billing" target="_blank" rel="noopener noreferrer" style={{ color: "#7EAAC8", textDecoration: "none", fontWeight: 600 }}>console.anthropic.com ↗</a> を開く</div>
              <div>② Billing → 残高（Credit balance）を確認</div>
              <div>③ ここに残高を記録する</div>
              <div>④ 数日後にまた記録すると消費ペースと残日数を予測🐺</div>
            </div>
          )}

          {/* Reference */}
          <div style={{ background: "white", borderRadius: 16, padding: "12px 16px", marginBottom: 14, boxShadow: "0 1px 8px rgba(155,181,224,0.08)" }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: "#AABBD4", marginBottom: 8 }}>1回あたりの目安</div>
            <div style={{ display: "flex", gap: 6 }}>
              {USAGE_PROFILES.map(p => (
                <div key={p.id} style={{ flex: 1, fontSize: 10, color: "#8A9BBF", textAlign: "center", background: "#F8FAFF", borderRadius: 8, padding: "8px 4px" }}>
                  <span style={{ fontSize: 14 }}>{p.emoji}</span>
                  <div style={{ fontWeight: 600, marginTop: 2 }}>${p.costPer}</div>
                  <div style={{ fontSize: 9, color: "#9AADCF", marginTop: 1 }}>{p.tokPer} tok</div>
                  <div style={{ fontSize: 8, color: "#C8D8EF", marginTop: 2 }}>{p.desc}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Data Management */}
          <div style={{ textAlign: "center", marginBottom: 10 }}>
            <button onClick={() => setShowData(!showData)} style={{ fontSize: 11, color: "#AABBD4", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", textDecoration: "underline" }}>📦 データ管理</button>
          </div>
          {showData && (
            <div style={{ background: "white", borderRadius: 16, padding: "14px 18px", marginBottom: 14, boxShadow: "0 2px 12px rgba(155,181,224,0.12)" }}>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={doExport} style={{ flex: 1, padding: 10, borderRadius: 10, border: "1.5px solid #D6E4F7", background: "white", color: "#8A9BBF", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>📤 エクスポート</button>
                <button onClick={() => fileRef.current && fileRef.current.click()} style={{ flex: 1, padding: 10, borderRadius: 10, border: "1.5px solid #D6E4F7", background: "white", color: "#8A9BBF", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>📥 インポート</button>
              </div>
              <input ref={fileRef} type="file" accept=".json" onChange={doImport} style={{ display: "none" }} />
              <div style={{ fontSize: 10, color: "#C8D8EF", marginTop: 8, textAlign: "center" }}>JSONでバックアップ・復元できます</div>
            </div>
          )}

          {/* Rate */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: 12, fontSize: 11, color: "#AABBD4" }}>
            <span>為替: $1 =</span>
            <input type="number" value={rate} onChange={e => setRate(Number(e.target.value) || 150)}
              style={{ width: 50, fontSize: 11, border: "none", borderBottom: "1px solid #D6E4F7", textAlign: "center", color: "#8A9BBF", background: "transparent", fontFamily: "inherit", outline: "none" }} />
            <span>円</span>
          </div>
          <div style={{ textAlign: "center", padding: "8px 0 20px", fontSize: 10, color: "#C8D8EF" }}>🐺🩵 chappiyo api tracker</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
